schema:
  version: '2.2'
  format: categories_and_sites_subcategories
  description: Подкатегории для точного маппинга
  rules:
  - Ищи hard_triggers в подкатегории → определи подкатегорию
  - Если hard_triggers не сработали → ищи keywords в подкатегории → определи подкатегорию
  - 'Внутри подкатегории: primary сайты → secondary → all'
  - 'Priority order: cables(0) > plumbing(1) > electrical(2) > ventilation(3) > instruments(4) > fire(5) > tools(6)'
  size_tokens: TBD
  size_percent: TBD
  optimal_for: Qwen-32b, batch up to 20 positions
  context_window_recommendation: Keep under 8000 tokens for structured data search tasks
excluded_sites:
- electro-mpo.ru
hints:
- product_type_id: unknown
  text: 'vodokomfort.ru: корпоративный сайт НЕ РАБОТАЕТ через Playwright (JS-оверлей поиска). Используй shop.vodokomfort.ru
    — там работает стандартный поиск.'
  priority: 0.9
- product_type_id: unknown
  text: 'satro-paladin.com: поиск — скрытый оверлей (Digi). Сначала кликни на иконку поиска, чтобы открыть форму, потом вводи
    запрос и нажимай «Найти».'
  priority: 0.85
- product_type_id: unknown
  text: Если get_confirmed_prices вернул цену с confidence >= 0.9 — используй её как финальную, НЕ проверяй в браузере.
  priority: 0.9
- product_type_id: unknown
  text: Если 2+ известных сайта не нашли товар по артикулу — используй Яндекс с ПОЛНЫМ названием товара из спецификации. Поиск
    по полному названию даёт лучшие результаты, чем по артикулу.
  priority: 0.85
- product_type_id: unknown
  text: Если сайт использует JS-SPA, поиск через form.submit() может не работать. Если за 5 шагов не нашёл — переключайся
    на другой сайт.
  priority: 0.8
- product_type_id: unknown
  text: Если 2+ известных сайта не дали результата — используй поисковую систему для поиска товара.
  priority: 0.8
- product_type_id: unknown
  text: Цены старше 1 месяца помечены ⚠️ и имеют пониженный confidence — такие цены нужно проверять через браузер, они не
    считаются финальными.
  priority: 0.7
