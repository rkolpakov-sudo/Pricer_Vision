antidetect:
  cooldown_seconds: 300
  jitter: 1.0
  rate_limit_max_requests_per_minute: 20
  rate_limit_min_interval: 1.5
  site_overrides:
    vseinstrumenti.ru:
      cooldown_seconds: 900
      max_requests_per_minute: 6
      min_interval: 6.0
browser:
  backend: camoufox
  backends:
  - camoufox
  - playwright
  - nodriver
  headless: true
  no_sandbox: true
deps:
  playwright_mcp:
    version: null
learning:
  hint_ttl_days: 90
  site_profiles_path: data/site_profiles.json
limits:
  max_retries_per_site: 3
  save_interval: 5
llm:
  llama_cpp_url: http://localhost:8080/v1/chat/completions
  lm_studio_url: http://localhost:1234/v1/chat/completions
  model: hy3-free
  ollama_url: http://localhost:11434/api/chat
  provider: opencode
  providers:
    llamacpp:
      base_url: http://localhost:8080/v1
    lmstudio:
      base_url: http://localhost:1234/v1
    ollama:
      base_url: http://localhost:11434/v1
    opencode:
      base_url: https://opencode.ai/zen/v1
    routerai:
      base_url: https://routerai.ru/api/v1
  retry:
    backoff_seconds: 1.5
    max_attempts: 3
    rate_limit_seconds: 0.05
  temperature: 0.3
  timeout: 150
mcp:
  call_timeout: 60
  restart_after_timeouts: 2
paths:
  backup: data/backup
  data_input: data/input
  data_output: data/output
  logs: logs
  state: state.json
pdf_parser:
  fast_path: true
  lang: east_slavic
  llm_max_chars: 3000
  llm_max_tokens: 1024
  llm_temperature: 0.0
  method: auto
  min_chars: 10
  ocr_min_text_length: 100
  review_threshold: 0.8
  timeout: 900
  use_llm: false
price:
  stale_days: 30
  vat_rate: 1.2
run:
  fresh: false
  group_by_site: false
  main_temperature: 0.3
  max_rounds: 50
  max_rounds_per_site: 15
  max_study_rounds: 50
  study_temperature: 0.5
  summarize_max_chars: 800
ui:
  log_rotation_mb: 10
  telemetry_update_ms: 1000
  theme: dark
vision_search:
  enabled: true
  max_vision_attempts: 2
  screenshot_format: jpeg
  screenshot_quality: 85
  search_url_first: true
  strategy: primary_fallback
