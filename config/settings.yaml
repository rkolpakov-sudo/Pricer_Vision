  save_interval: 5
llm:
  llama_cpp_url: http://localhost:8080/v1/chat/completions
  lm_studio_url: http://localhost:1234/v1/chat/completions
  model: esatapedico/qwen3.8-27b-nvfp4-mtp-gguf/qwen3.8-27b-nvfp4-mtp-very-low.gguf
  ollama_url: http://localhost:11434/api/chat
  provider: lmstudio
  providers:
    llamacpp:
      base_url: http://localhost:8080/v1
    lmstudio:
      base_url: http://localhost:1234/v1
    ollama:
      base_url: http://localhost:11434/v1
    opencode:
      base_url: https://opencode.ai/zen/v1
    routerai:
      base_url: https://routerai.ru/api/v1
  retry:
    backoff_seconds: 1.5
    max_attempts: 3
    rate_limit_seconds: 0.05
  temperature: 0.3
  timeout: 150
mcp:
  call_timeout: 60
  restart_after_timeouts: 2
paths:
  backup: data/backup
  data_input: data/input
  data_output: data/output
  logs: logs
  state: state.json
pdf_parser:
  fast_path: true
  lang: east_slavic
  llm_max_chars: 3000
  llm_max_tokens: 1024
  llm_temperature: 0.0
  method: auto
  min_chars: 10
  ocr_min_text_length: 100
  review_threshold: 0.8
  timeout: 900
  use_llm: false
price:
  stale_days: 30
  vat_rate: 1.2
run:
  fresh: false
  group_by_site: false
  main_temperature: 0.3
  max_rounds: 40
  max_rounds_per_site: 15
  max_study_rounds: 50
  reuse_price: false
  row_idle_timeout_seconds: 180
  row_max_seconds: 300
  study_temperature: 0.5
  summarize_max_chars: 8000
  use_approaches: true
  use_site_ranking: true
ui:
  log_rotation_mb: 10
  telemetry_update_ms: 1000
  theme: dark
vision_search:
  enabled: true
  max_vision_attempts: 2
  screenshot_format: jpeg
  screenshot_quality: 85
  search_url_first: true
  strategy: primary_fallback
