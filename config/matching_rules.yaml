# Правила сопоставления наименований товаров.
# Редактировать удобнее из приложения: кнопка «Правила сопоставления» в главном окне.
#
# Каждый раздел ниже — ПОЛНЫЙ список: если раздел есть в файле, он заменяет
# встроенный список целиком. Удалите раздел (или оставьте пустым — значение null),
# чтобы вернуть встроенный список. Пустой список «[]» означает «никаких слов».
# Фразам регистр не важен («ТРУБА» = «труба»), лишние пробелы не важны.

# Слова, не несущие смысла при сравнении наименований (не участвуют в проверке).
stopwords:
  - для
  - из
  - с
  - со
  - на
  - по
  - в
  - во
  - и
  - не
  - или
  - к
  - у
  - от
  - при
  - за
  - что
  - это
  - как
  - так
  - об
  - про
  - под
  - мм
  - ду
  - типа
  - тип
  - размер
  - новый
  - отечественный

# Слова, которые не доказывают сходство товаров («завод-изготовитель Ридан»
# и «завод-изготовитель Пульсар» не похожи из-за общего «завод-изготовитель»).
structural_words:
  - завод
  - изготовитель
  - производитель
  - марка
  - бренд
  - гост
  - ту

# Параметры, которые в спецификации есть, но в названии карточки могут отсутствовать
# (указаны в характеристиках/описании) — при сравнении не обязательны.
param_words:
  - ру
  - pn
  - нр
  - np
  - kvs
  - kv
  - бар
  - па
  - атм
  - тмакс
  - макс
  - мин
  - max
  - min
  - град

# Сокращения типов соединения: сокращение → полная форма.
# «фл» (2 символа) выпадает из токенизации, из-за чего «фланцевый» не находится
# в названиях карточек («Ду 100 Ру16 фл Kvs=...»).
abbreviations:
  фл: фланцевый

# Контекстные правила: характеристика НЕ важна для конкретного типа товара.
# - base: базовое наименование товара — если оно встречается в наименовании,
#   то фраза drop считается незначимой и на совпадение не влияет.
# - drop: незначимая фраза.
# Пример: «Труба стальная водогазопроводная оцинкованная на грувлоках ⌀150х4,5»
# должна совпадать с «Труба стальная водогазопроводная оцинкованная ⌀150х4,5»,
# но вне этого контекста «грувлок» остаётся значимым («Труба на грувлоках» ≠ «Труба»).
context_insignificant:
  - base: Труба стальная водогазопроводная оцинкованная
    drop: на грувлоках
